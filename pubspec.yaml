name: online_graveyard
description: A Flutter application built with Clean Architecture.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.1
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0
  firebase_auth: ^5.5.1
  firebase_analytics: ^11.6.0

  # Auth
  google_sign_in: ^6.3.0

  # State Management
  provider: ^6.1.5+1

  # Internationalization
  intl: ^0.19.0

  # Media
  video_player: ^2.9.2

  # UI
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  google_fonts: ^8.0.1
  image_picker: ^1.2.1

  # Utilities
  shared_preferences: ^2.5.4
  share_plus: ^10.1.4
  local_auth: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

